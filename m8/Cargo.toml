[package]
name = "m8"
version = "0.1.0"
edition = "2021"
description = "A voice brain for AI companions in games: it hears, decides, talks, sees and speaks"

[dependencies]
anyhow = "1.0"
cpal = "0.16"
ptts = { version = "0.4.0-rc.2", features = ["hf", "hub"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sherpa-onnx = "1.13.8"
tiny_http = "0.12"
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
debug = false
